<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内网 HTTPS 证书链选配器</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>内网 HTTPS 证书链选配器</h1>
  <p class="subtitle">
    保留已签发的叶子证书，从候选中间证书中按签发关系选配一条 PEM 链；
    每批终端只用自己的根证书包、在同一核验时刻按域名核验，取全部批次均通过的
    DER 总字节最小链，并对照各批部署字节上限给出结论。
  </p>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <h2>1. 服务域名与叶子证书（叶子原样保留，不参与选配）</h2>
      <button type="button" class="btn ghost" id="loadSample">载入证书样例</button>
    </div>
    <div class="form-row">
      <label class="domain-label">服务域名
        <input type="text" id="hostname" placeholder="demo.service.internal" spellcheck="false">
      </label>
    </div>
    <div class="pem-label">叶子证书 PEM（仅 1 张 -----BEGIN CERTIFICATE-----）</div>
    <textarea id="leafPem" class="pem" rows="6" spellcheck="false"></textarea>
    <div class="pem-summary" id="leafSummary"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>2. 候选中间证书（最多 8 张，每槽 1 张；允许同一 CA 由不同上级签发的多张证书）</h2>
      <button type="button" class="btn small" id="addCandidate">＋ 添加候选</button>
    </div>
    <div id="candidates"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>3. 终端批次（最多 4 批，每批一个根证书包与一个部署字节上限）</h2>
      <button type="button" class="btn small" id="addBatch">＋ 添加批次</button>
    </div>
    <div id="batches"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="solveBtn">选配最小证书链</button>
      <span id="formError" class="error"></span>
    </div>
  </section>

  <section id="result" class="card hidden">
    <h2>4. 选配结果</h2>
    <div id="resultBody"></div>
  </section>
</main>

<template id="candidateTpl">
  <div class="entity candidate">
    <div class="entity-head">
      <span class="entity-title">候选 <span class="idx"></span></span>
      <button type="button" class="btn small danger remove">删除</button>
    </div>
    <textarea class="candidate-pem pem" rows="4" spellcheck="false"
      placeholder="粘贴 1 张中间 CA 证书 PEM"></textarea>
    <div class="pem-summary"></div>
  </div>
</template>

<template id="batchTpl">
  <div class="entity batch">
    <div class="entity-head">
      <span class="entity-title">批次 <span class="idx"></span></span>
      <label>批次名称 <input type="text" class="batch-name" placeholder="终端批次1"></label>
      <label>部署字节上限
        <input type="number" class="byte-limit" min="1" step="1" value="4096">
      </label>
      <button type="button" class="btn small danger remove">删除</button>
    </div>
    <div class="pem-label">该批终端的根证书包 PEM（一个或多个信任根）</div>
    <textarea class="bundle-pem pem" rows="4" spellcheck="false"></textarea>
    <div class="pem-summary"></div>
  </div>
</template>

<script>
const SAMPLE = {{ sample | tojson }};
const MAX_CANDIDATES = 8;
const MAX_BATCHES = 4;

const candidatesEl = document.getElementById('candidates');
const batchesEl = document.getElementById('batches');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renumber(container) {
  [...container.children].forEach((el, i) => {
    el.querySelector('.idx').textContent = i + 1;
    el.querySelector('.remove').disabled = container.children.length <= 1;
  });
}

function addCandidate(pem) {
  if (candidatesEl.children.length >= MAX_CANDIDATES) return;
  const node = document.getElementById('candidateTpl').content.firstElementChild.cloneNode(true);
  candidatesEl.appendChild(node);
  node.querySelector('.remove').addEventListener('click', () => {
    node.remove(); renumber(candidatesEl);
  });
  const ta = node.querySelector('textarea');
  if (pem) { ta.value = pem; refreshSummary(ta); }
  else ta.addEventListener('blur', () => refreshSummary(ta));
  renumber(candidatesEl);
}

function addBatch(data) {
  if (batchesEl.children.length >= MAX_BATCHES) return;
  const node = document.getElementById('batchTpl').content.firstElementChild.cloneNode(true);
  batchesEl.appendChild(node);
  node.querySelector('.remove').addEventListener('click', () => {
    node.remove(); renumber(batchesEl);
  });
  const ta = node.querySelector('textarea');
  ta.addEventListener('blur', () => refreshSummary(ta));
  if (data) {
    node.querySelector('.batch-name').value = data.name || '';
    node.querySelector('.byte-limit').value = data.byte_limit ?? 4096;
    ta.value = data.bundle_pem || '';
    refreshSummary(ta);
  }
  renumber(batchesEl);
}

async function refreshSummary(textarea) {
  const pem = textarea.value.trim();
  const summaryEl = textarea.parentElement.querySelector('.pem-summary');
  if (!pem) { summaryEl.textContent = ''; summaryEl.className = 'pem-summary'; return; }
  let kind = 'candidate';
  if (textarea.id === 'leafPem') kind = 'leaf';
  else if (textarea.classList.contains('bundle-pem')) kind = 'bundle';
  const resp = await fetch('/api/summaries', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({kind, pem})
  });
  const data = await resp.json();
  if (data.ok) {
    const s = data.summary;
    summaryEl.className = 'pem-summary ok';
    if (kind === 'bundle') {
      summaryEl.textContent = `✓ 根包内含 ${s.count} 个证书，DER 合计 ${s.der_bytes} 字节：${s.subjects.join(' | ')}`;
    } else {
      summaryEl.textContent = `✓ ${s.is_ca ? 'CA' : '叶子'} CN=${s.common_name || '-'}；`
        + `颁发者=${s.issuer}；DER=${s.der_bytes} 字节；有效期至 ${s.not_valid_after}`
        + (s.sans && s.sans.length ? `；SAN=${s.sans.join(', ')}` : '');
    }
  } else {
    summaryEl.className = 'pem-summary bad';
    summaryEl.textContent = '✗ ' + data.error;
  }
}

document.getElementById('leafPem').addEventListener('blur', e => refreshSummary(e.target));
document.getElementById('addCandidate').addEventListener('click', () => addCandidate());
document.getElementById('addBatch').addEventListener('click', () => addBatch());

document.getElementById('loadSample').addEventListener('click', () => {
  if (!SAMPLE) { alert('样例文件不存在（samples/sample.json）'); return; }
  document.getElementById('hostname').value = SAMPLE.hostname || '';
  const leaf = document.getElementById('leafPem');
  leaf.value = SAMPLE.leaf_pem || '';
  refreshSummary(leaf);
  candidatesEl.innerHTML = '';
  (SAMPLE.candidate_pems || []).forEach(pem => addCandidate(pem));
  batchesEl.innerHTML = '';
  (SAMPLE.batches || []).forEach(b => addBatch(b));
});

function collect() {
  const candidate_pems = [...candidatesEl.querySelectorAll('textarea')].map(t => t.value).filter(v => v.trim());
  const batches = [...batchesEl.children].map(node => ({
    name: node.querySelector('.batch-name').value.trim(),
    byte_limit: node.querySelector('.byte-limit').value,
    bundle_pem: node.querySelector('textarea').value,
  }));
  return {
    hostname: document.getElementById('hostname').value.trim(),
    leaf_pem: document.getElementById('leafPem').value,
    candidate_pems,
    batches,
  };
}

function renderChecks(checks) {
  return `<h3>各批终端核验结果（同一核验时刻、信任锚仅来自该批根包）</h3>
  <table class="diag">
    <thead><tr><th>批次</th><th>openssl 核验</th><th>链 DER 字节</th><th>部署上限</th><th>是否装得下</th><th>失败原因</th></tr></thead>
    <tbody>${checks.map(c => `<tr>
      <td>${esc(c.batch_name)}</td>
      <td><span class="tag ${c.ok ? 'ok' : 'danger'}">${c.ok ? '通过' : '失败'}</span></td>
      <td>${c.total_bytes}</td>
      <td>${c.byte_limit}</td>
      <td><span class="tag ${c.fits_limit ? 'ok' : 'warn'}">${c.fits_limit ? '装得下' : '超出 ' + (c.total_bytes - c.byte_limit) + ' 字节'}</span></td>
      <td class="reason">${esc(c.reason || '')}</td></tr>`).join('')}</tbody>
  </table>`;
}

function renderChain(chain) {
  return `<h3>选中的链（叶子在前，中间 CA 按签发关系依次在后）</h3>
  <table class="diag">
    <thead><tr><th>#</th><th>角色</th><th>主题 CN</th><th>颁发者</th><th>DER 字节</th><th>有效期至 (UTC)</th></tr></thead>
    <tbody>${chain.map(m => `<tr>
      <td>${m.position}</td><td>${esc(m.role)}</td><td>${esc(m.common_name)}</td>
      <td>${esc(m.issuer)}</td><td>${m.der_bytes}</td><td>${esc(m.not_valid_after)}</td></tr>`).join('')}</tbody>
  </table>`;
}

function renderInfeasibility(rows) {
  return `<h3>无共用链诊断：每批终端对全部候选链的核验情况</h3>
  <table class="diag">
    <thead><tr><th>批次</th><th>可通过链数</th><th>主要 openssl 失败原因（出现次数）</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.batch_name)}</td>
      <td>${r.chains_verified} / ${r.chains_total}</td>
      <td><ul class="cells">${r.reasons.map(x =>
        `<li class="bad"><span class="reason">${esc(x.reason)}</span> × ${x.occurrences}</li>`).join('')}</ul>
      </td></tr>`).join('')}</tbody>
  </table>`;
}

document.getElementById('solveBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('formError');
  errEl.textContent = '';
  const payload = collect();
  const btn = document.getElementById('solveBtn');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/select', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    const resultEl = document.getElementById('result');
    const body = document.getElementById('resultBody');
    resultEl.classList.remove('hidden');
    if (!data.ok) {
      body.innerHTML = `<div class="banner bad"><strong>输入有误：</strong>${esc(data.error)}</div>`;
      return;
    }
    let html = '';
    if (data.status === 'fit') {
      html += `<div class="banner ok"><strong>${esc(data.message)}</strong></div>`;
      html += renderChain(data.chain);
      html += `<h3>可部署 PEM（点击按钮复制，DER 合计 <strong>${data.total_bytes}</strong> 字节）</h3>
        <div class="pem-box-wrap">
          <button type="button" class="btn small" id="copyPem">复制 PEM</button>
          <span class="hint" id="copyHint"></span>
        </div>
        <textarea id="resultPem" class="pem pem-box" rows="12" readonly spellcheck="false">${esc(data.pem)}</textarea>`;
      html += renderChecks(data.checks);
    } else if (data.status === 'too_large') {
      html += `<div class="banner warn"><strong>最小链仍超部署上限。</strong>${esc(data.message)}<br>`
        + `最小可行链需要 <strong>${data.total_bytes}</strong> 字节（叶子 ${data.leaf_bytes} 字节）。</div>`;
      html += renderChain(data.chain);
      html += `<h3>最小可行链 PEM（供上调字节上限后直接部署；点击按钮复制）</h3>
        <div class="pem-box-wrap">
          <button type="button" class="btn small" id="copyPem">复制 PEM</button>
          <span class="hint" id="copyHint"></span>
        </div>
        <textarea id="resultPem" class="pem pem-box" rows="12" readonly spellcheck="false">${esc(data.pem)}</textarea>`;
      html += renderChecks(data.checks);
    } else {
      html += `<div class="banner bad"><strong>无解。</strong>${esc(data.message)}</div>`;
      html += renderInfeasibility(data.infeasibility);
    }
    html += `<p class="hint">共枚举 ${data.enumerated_chains} 条由签发关系可达的候选链（含仅叶子链），按 DER 总字节升序核验。</p>`;
    body.innerHTML = html;
    const copyBtn = document.getElementById('copyPem');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const box = document.getElementById('resultPem');
        await navigator.clipboard.writeText(box.value);
        document.getElementById('copyHint').textContent = '已复制 ' + box.value.length + ' 个字符';
      });
    }
    resultEl.scrollIntoView({behavior: 'smooth'});
  } finally {
    btn.disabled = false;
  }
});

// 初始给若干空行，并在有样例时自动载入
addCandidate();
addBatch();
if (SAMPLE) document.getElementById('loadSample').click();
</script>
</body>
</html>
